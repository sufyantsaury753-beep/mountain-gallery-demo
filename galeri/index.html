<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galeri &amp; Jalur Pendakian - Mountain Gallery Demo</title>

  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/gallery.css" />
</head>

<body>
  <div class="page-container">
    <!-- Topbar Navigation -->
    <header class="topbar">
      <a class="brand-wrapper" href="../index.html">
        <div class="brand-logo">
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <rect x="6" y="6" width="52" height="52" rx="16" fill="#ffffff"/>
            <path d="M14 44L28 22L36 34L43 27L51 44" fill="none" stroke="url(#igLogoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M22 44H51" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
            <circle cx="46" cy="18" r="4" fill="#FCAF45"/>
          </svg>
        </div>
        <div class="brand-info">
          <h1>Mountain Gallery</h1>
          <p>Galeri Dokumentasi &amp; Peta Wisata</p>
        </div>
      </a>

      <div class="topbar-actions">
        <a href="../index.html" class="btn-back-map" style="display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:999px; background:rgba(255,255,255,0.9); color:var(--text-main); font-size:12.5px; font-weight:800; text-decoration:none; border:1px solid #e2e8f0;">
          <span class="svg-icon"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></span>
          Kembali ke Peta
        </a>
        <button type="button" class="menu-trigger-btn" onclick="toggleMenu(event)" aria-label="Menu">
          <span class="svg-icon"><svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></span>
        </button>
      </div>

      <!-- Drawer Dropdown Menu -->
      <div class="site-dropdown" id="siteDropdown">
        <div class="dropdown-header">
          <div>
            <strong>Navigasi Menu</strong>
            <small>Pilih 21 Destinasi Gunung</small>
          </div>
          <button type="button" class="dropdown-close-btn" onclick="toggleMenu(event)" aria-label="Tutup">
            <span class="svg-icon"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>
          </button>
        </div>

        <a class="dropdown-item" href="../index.html">
          <span class="menu-icon-box">
            <span class="svg-icon"><svg viewBox="0 0 24 24"><path d="M3 11L12 4L21 11M5 10V20H10V14H14V20H19V10"/></svg></span>
          </span>
          <div>
            <strong>Beranda Peta Interaktif</strong>
            <small>Eksplorasi peta GIS pulau Jawa</small>
          </div>
        </a>

        <button type="button" class="dropdown-item" onclick="toggleMountainList(event)">
          <span class="menu-icon-box">
            <span class="svg-icon"><svg viewBox="0 0 24 24"><path d="M3 19L9 8L14 15L17 11L21 19H3Z"/></svg></span>
          </span>
          <div>
            <strong>Daftar 21 Gunung</strong>
            <small>Pindah ke halaman galeri lain</small>
          </div>
        </button>

        <div class="dropdown-mountain-list" id="dropdownMountainList"></div>

        <a class="dropdown-item" href="../admin/index.html">
          <span class="menu-icon-box" style="background:linear-gradient(135deg, #833ab4, #e1306c); color:#fff;">
            <span class="svg-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          </span>
          <div>
            <strong style="color:#c13584;">Demo Admin CMS</strong>
            <small>Kelola data &amp; upload foto</small>
          </div>
        </a>
      </div>
    </header>

    <!-- Hero Banner -->
    <section class="gallery-hero" id="heroBanner">
      <div class="gallery-hero-content">
        <div class="gallery-hero-badge" id="mountainMdplBadge">2.958 Mdpl</div>
        <h1 class="gallery-hero-title" id="mountainName">Gunung Gede</h1>
        <p class="gallery-hero-location" id="mountainLocation"></p>
        <p class="gallery-hero-desc" id="mountainDesc"></p>
      </div>
    </section>

    <!-- Main Detail Content -->
    <main class="gallery-main-container">
      <!-- Technical Stats Bar -->
      <section class="tech-stats-grid" id="techStatsContainer"></section>

      <!-- Hiking Routes Section -->
      <section class="routes-section">
        <h2 class="section-title">
          <span class="svg-icon"><svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></span>
          Jalur &amp; Rute Pendakian Resmi
        </h2>
        <div class="routes-grid" id="routesListContainer"></div>
      </section>

      <!-- Media Gallery Section -->
      <section class="media-section">
        <div class="media-section-header">
          <h2 class="section-title">
            <span class="svg-icon"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></span>
            Galeri Dokumentasi Puncak &amp; Trek
          </h2>

          <div class="media-filter-chips">
            <button type="button" class="media-filter-btn active" data-filter="all">Semua Media</button>
            <button type="button" class="media-filter-btn" data-filter="image">Foto</button>
            <button type="button" class="media-filter-btn" data-filter="video">Video</button>
          </div>
        </div>

        <div class="media-masonry-grid" id="mediaGrid"></div>
      </section>
    </main>

    <!-- Lightbox Modal -->
    <div class="lightbox-backdrop" id="lightboxModal" onclick="closeLightbox()">
      <div class="lightbox-card" onclick="event.stopPropagation()">
        <button type="button" class="lightbox-close-btn" onclick="closeLightbox()">&times;</button>
        <div id="lightboxContent" class="lightbox-media-box"></div>
        <div class="lightbox-info">
          <strong id="lightboxTitle"></strong>
          <p id="lightboxDesc"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Application Logic -->
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/gallery.js"></script>
</body>
</html>
